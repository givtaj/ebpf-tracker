name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: verify Linux release and tracer runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-version.sh
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            workspace_version="$(awk '/^\[workspace.package\]$/ { section=1; next } /^\[/ { section=0 } section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
            release_tag="v${workspace_version}"
          fi
          is_release_tag "${release_tag}" || { echo "Unsupported release tag: ${release_tag}" >&2; exit 1; }
          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run strict release gate
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          bash scripts/release-check.sh \
            --expected-version "${expected_version}" \
            --with-runtime-smoke \
            --with-demo-smoke \
            --with-isolation-smoke \
            --with-customer-ux

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --bin ebpf-tracker --target ${{ matrix.target }}

      - name: Smoke packaged binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          tracker="target/${{ matrix.target }}/release/ebpf-tracker"
          [[ "$("${tracker}" --version)" == "ebpf-tracker ${RELEASE_TAG#v}" ]]
          "${tracker}" --help
          "${tracker}" replay --help

      - name: Package archive
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          package_name="ebpf-tracker-${RELEASE_TAG}-${{ matrix.target }}"
          package_dir="dist/${package_name}"
          archive_name="${package_dir}.tar.gz"
          mkdir -p "${package_dir}"
          cp "target/${{ matrix.target }}/release/ebpf-tracker" "${package_dir}/"
          cp LICENSE "${package_dir}/"
          cp README.md "${package_dir}/"
          COPYFILE_DISABLE=1 tar -czf "${archive_name}" -C dist "${package_name}"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-tracker-${{ needs.validate.outputs.release_tag }}-${{ matrix.target }}
          path: dist/ebpf-tracker-${{ needs.validate.outputs.release_tag }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: verify and assemble release assets
    runs-on: ubuntu-latest
    needs: [validate, build]
    timeout-minutes: 50

    steps:
      # Keep the build runner's original CARGO_MANIFEST_DIR absent so the
      # downloaded binary must use its embedded runtime, demos, and viewer.
      - name: Checkout acceptance scripts at an alternate path
        uses: actions/checkout@v7
        with:
          path: release-source

      - name: Install Rust for demo cleanup
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node for offline replay
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download platform archives
        uses: actions/download-artifact@v7
        with:
          pattern: ebpf-tracker-${{ needs.validate.outputs.release_tag }}-*
          path: dist
          merge-multiple: true

      - name: Verify archives and write checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: bash release-source/scripts/verify-release-artifacts.sh --dist dist --tag "${RELEASE_TAG}" --write-checksums

      - name: Verify installed Linux archive outside the checkout
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          bash release-source/scripts/installed-alpha-smoke.sh \
            --archive "dist/ebpf-tracker-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            --expected-version "${RELEASE_TAG#v}"

      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ needs.validate.outputs.release_tag }}
          path: |
            dist/ebpf-tracker-${{ needs.validate.outputs.release_tag }}-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: [validate, assemble]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7

      - name: Download verified release assets
        uses: actions/download-artifact@v7
        with:
          name: release-assets-${{ needs.validate.outputs.release_tag }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ebpf-tracker-${{ needs.validate.outputs.release_tag }}-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.release_tag, '-') }}
