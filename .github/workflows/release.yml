name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Live gates use native Ubuntu 22.04 hosts while actions/runner-images#15003 affects 24.04.
  # Build the host CLI on the same baseline for its glibc compatibility.
  validate:
    name: verify Linux release and tracer runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-version.sh
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            workspace_version="$(awk '/^\[workspace.package\]$/ { section=1; next } /^\[/ { section=0 } section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
            release_tag="v${workspace_version}"
          fi
          is_release_tag "${release_tag}" || { echo "Unsupported release tag: ${release_tag}" >&2; exit 1; }
          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run strict release gate
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          bash scripts/release-check.sh \
            --expected-version "${expected_version}" \
            --with-runtime-smoke \
            --with-demo-smoke \
            --with-isolation-smoke \
            --with-customer-ux

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --bin ebpf-tracker --target ${{ matrix.target }}

      - name: Smoke packaged binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          tracker="target/${{ matrix.target }}/release/ebpf-tracker"
          [[ "$("${tracker}" --version)" == "ebpf-tracker ${RELEASE_TAG#v}" ]]
          "${tracker}" --help
          "${tracker}" replay --help

      - name: Package archive
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          package_name="ebpf-tracker-${RELEASE_TAG}-${{ matrix.target }}"
          package_dir="dist/${package_name}"
          archive_name="${package_dir}.tar.gz"
          mkdir -p "${package_dir}"
          cp "target/${{ matrix.target }}/release/ebpf-tracker" "${package_dir}/"
          cp LICENSE "${package_dir}/"
          cp README.md "${package_dir}/"
          COPYFILE_DISABLE=1 tar -czf "${archive_name}" -C dist "${package_name}"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-tracker-${{ needs.validate.outputs.release_tag }}-${{ matrix.target }}
          path: dist/ebpf-tracker-${{ needs.validate.outputs.release_tag }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  runtime-package:
    name: build and verify installed runtime package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require a native host and Docker engine
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          docker_arch="$(docker info --format '{{.Architecture}}')"
          case "${host_arch}" in x86_64) host_arch=amd64 ;; aarch64) host_arch=arm64 ;; esac
          case "${docker_arch}" in x86_64) docker_arch=amd64 ;; aarch64) docker_arch=arm64 ;; esac
          [[ "${host_arch}" == "${EXPECTED_ARCH}" && "${docker_arch}" == "${EXPECTED_ARCH}" ]]
          [[ -z "${DOCKER_DEFAULT_PLATFORM:-}" || "${DOCKER_DEFAULT_PLATFORM}" == "linux/${EXPECTED_ARCH}" ]]
          uname -a
          docker info --format '{{.OSType}}/{{.Architecture}} {{.KernelVersion}}'

      - name: Build and install-check Bookworm runtime package
        run: bash scripts/build-runtime-deb.sh --platform linux/${{ matrix.arch }} --output-dir dist/runtime

      - name: Verify package metadata and contents
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          source scripts/release-version.sh
          version="${RELEASE_TAG#v}"
          debian_version="$(debian_release_version "${version}")"
          bash scripts/verify-runtime-package.sh \
            --deb "dist/runtime/ebpf-tracker-runtime_${debian_version}_${{ matrix.arch }}.deb" \
            --expected-version "${version}" --arch ${{ matrix.arch }}

      - name: Verify live installed agent with Axum and PostgreSQL
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          source scripts/release-version.sh
          version="${RELEASE_TAG#v}"
          debian_version="$(debian_release_version "${version}")"
          bash scripts/in-container-smoke.sh \
            --package "${PWD}/dist/runtime/ebpf-tracker-runtime_${debian_version}_${{ matrix.arch }}.deb" \
            --output-dir "${RUNNER_TEMP}/runtime-package-evidence"

      - name: Install Rust for the replay CLI
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node for offline replay
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Replay the delivered package's actual API capture
        run: |
          cargo build --locked --bin ebpf-tracker
          bash scripts/replay-smoke.sh --tracker target/debug/ebpf-tracker --trace "${RUNNER_TEMP}/runtime-package-evidence/events.jsonl"

      - name: Retain runtime acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-package-evidence-${{ needs.validate.outputs.release_tag }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-package-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified runtime package
        uses: actions/upload-artifact@v7
        with:
          name: runtime-package-${{ needs.validate.outputs.release_tag }}-${{ matrix.arch }}
          path: |
            dist/runtime/*.deb
            dist/runtime/SHA256SUMS.runtime
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: verify and assemble release assets
    runs-on: ubuntu-22.04
    needs: [validate, build, runtime-package]
    timeout-minutes: 50

    steps:
      # Keep the build runner's original CARGO_MANIFEST_DIR absent so the
      # downloaded binary must use its embedded runtime, demos, and viewer.
      - name: Checkout acceptance scripts at an alternate path
        uses: actions/checkout@v7
        with:
          path: release-source

      - name: Install Rust for demo cleanup
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node for offline replay
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download platform archives
        uses: actions/download-artifact@v7
        with:
          pattern: ebpf-tracker-${{ needs.validate.outputs.release_tag }}-*
          path: dist
          merge-multiple: true

      - name: Verify archives and write checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: bash release-source/scripts/verify-release-artifacts.sh --dist dist --tag "${RELEASE_TAG}" --write-checksums

      - name: Download both verified runtime packages without merging manifests
        uses: actions/download-artifact@v7
        with:
          pattern: runtime-package-${{ needs.validate.outputs.release_tag }}-*
          path: runtime-artifacts
          merge-multiple: false

      - name: Verify both runtime packages and include their checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          source release-source/scripts/release-version.sh
          version="${RELEASE_TAG#v}"
          debian_version="$(debian_release_version "${version}")"
          for arch in amd64 arm64; do
            artifact_dir="runtime-artifacts/runtime-package-${RELEASE_TAG}-${arch}"
            local_name="ebpf-tracker-runtime_${debian_version}_${arch}.deb"
            public_name="ebpf-tracker-runtime_${version}_${arch}.deb"
            [[ -s "${artifact_dir}/${local_name}" && -s "${artifact_dir}/SHA256SUMS.runtime" ]]
            # Verify the original architecture-specific manifest before assembly.
            expected_checksum="$(cd "${artifact_dir}" && sha256sum "${local_name}")"
            [[ "$(cat "${artifact_dir}/SHA256SUMS.runtime")" == "${expected_checksum}" ]]
            bash release-source/scripts/verify-runtime-package.sh \
              --deb "${artifact_dir}/${local_name}" \
              --expected-version "${version}" --arch "${arch}"
            # GitHub rewrites '~': hash the public filename, preserving package bytes.
            cp "${artifact_dir}/${local_name}" "dist/${public_name}"
            bash release-source/scripts/verify-runtime-package.sh \
              --deb "dist/${public_name}" \
              --expected-version "${version}" --arch "${arch}"
            (cd dist && sha256sum "${public_name}") >> dist/SHA256SUMS
          done
          packages=(dist/ebpf-tracker-runtime_*.deb)
          [[ "${#packages[@]}" -eq 2 && "$(wc -l < dist/SHA256SUMS)" -eq 4 ]]
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Verify installed Linux archive outside the checkout
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          bash release-source/scripts/installed-alpha-smoke.sh \
            --archive "dist/ebpf-tracker-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            --expected-version "${RELEASE_TAG#v}"

      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ needs.validate.outputs.release_tag }}
          path: |
            dist/ebpf-tracker-${{ needs.validate.outputs.release_tag }}-*.tar.gz
            dist/ebpf-tracker-runtime_*_amd64.deb
            dist/ebpf-tracker-runtime_*_arm64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub release
    runs-on: ubuntu-22.04
    needs: [validate, assemble]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7

      - name: Download verified release assets
        uses: actions/download-artifact@v7
        with:
          name: release-assets-${{ needs.validate.outputs.release_tag }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ebpf-tracker-${{ needs.validate.outputs.release_tag }}-*.tar.gz
            dist/ebpf-tracker-runtime_*_amd64.deb
            dist/ebpf-tracker-runtime_*_arm64.deb
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.release_tag, '-') }}
