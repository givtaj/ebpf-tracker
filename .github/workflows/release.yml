name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: verify Linux release and tracer runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run strict release gate
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          bash scripts/release-check.sh \
            --expected-version "${expected_version}" \
            --with-runtime-smoke \
            --with-demo-smoke \
            --with-isolation-smoke \
            --with-customer-ux

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --bin ebpf-tracker --target ${{ matrix.target }}

      - name: Smoke packaged binary
        run: target/${{ matrix.target }}/release/ebpf-tracker --help

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/ebpf-tracker-${{ github.ref_name }}-${{ matrix.target }}"
          archive_name="${package_dir}.tar.gz"
          mkdir -p "${package_dir}"
          cp "target/${{ matrix.target }}/release/ebpf-tracker" "${package_dir}/"
          cp LICENSE "${package_dir}/"
          cp README.md "${package_dir}/"
          tar -czf "${archive_name}" -C dist "ebpf-tracker-${{ github.ref_name }}-${{ matrix.target }}"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-tracker-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/ebpf-tracker-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: verify and assemble release assets
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download platform archives
        uses: actions/download-artifact@v7
        with:
          pattern: ebpf-tracker-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Verify archives and write checksums
        run: bash scripts/verify-release-artifacts.sh --dist dist --tag "${GITHUB_REF_NAME}" --write-checksums

      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: |
            dist/ebpf-tracker-${{ github.ref_name }}-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: assemble
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ebpf-tracker-${{ github.ref_name }}-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
