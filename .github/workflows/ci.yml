name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --all --locked

      - name: Build
        run: cargo build --workspace --locked

  smoke:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Viewer smoke
        run: bash scripts/dashboard-smoke.sh --check

      - name: Dataset smoke
        run: bash scripts/dataset-smoke.sh

  customer-ux:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check customer UX capabilities
        id: customer_ux_capabilities
        shell: bash
        run: |
          set -euo pipefail
          required_scripts=(
            scripts/customer-ux-check.sh
            scripts/customer-cli-e2e.sh
            scripts/customer-viewer-e2e.sh
            scripts/customer-data-e2e.sh
          )
          for required_script in "${required_scripts[@]}"; do
            if [[ ! -f "${required_script}" ]]; then
              echo "required customer UX script is missing: ${required_script}" >&2
              exit 1
            fi
          done

          customer_ux_reason=""
          if ! command -v cargo >/dev/null 2>&1; then
            customer_ux_reason="cargo is unavailable on this runner"
          elif ! command -v docker >/dev/null 2>&1; then
            customer_ux_reason="Docker CLI is unavailable on this runner"
          elif ! docker info >/dev/null 2>&1; then
            customer_ux_reason="Docker daemon is unavailable on this runner"
          elif ! command -v curl >/dev/null 2>&1; then
            customer_ux_reason="curl is unavailable on this runner"
          elif [[ ! -x /bin/true ]]; then
            customer_ux_reason="/bin/true is unavailable on this runner"
          elif ! command -v python3 >/dev/null 2>&1; then
            customer_ux_reason="python3 is unavailable for the loopback bind preflight"
          elif ! python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); sock.close()' >/dev/null 2>&1; then
            customer_ux_reason="this runner cannot bind 127.0.0.1"
          fi

          if [[ -n "${customer_ux_reason}" ]]; then
            echo "customer_ux_available=0" >> "${GITHUB_OUTPUT}"
            echo "customer_ux_reason=${customer_ux_reason}" >> "${GITHUB_OUTPUT}"
          else
            echo "customer_ux_available=1" >> "${GITHUB_OUTPUT}"
            echo "customer_ux_reason=runner prerequisites satisfied" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run customer UX suite (strict when supported)
        shell: bash
        env:
          CUSTOMER_UX_AVAILABLE: ${{ steps.customer_ux_capabilities.outputs.customer_ux_available }}
          CUSTOMER_UX_REASON: ${{ steps.customer_ux_capabilities.outputs.customer_ux_reason }}
        run: |
          set -euo pipefail
          if [[ "${CUSTOMER_UX_AVAILABLE}" == "1" ]]; then
            bash scripts/customer-ux-check.sh --strict-prereqs --fail-on-skip
          else
            echo "::warning title=Customer UX runtime skipped::${CUSTOMER_UX_REASON}"
            {
              echo "### Customer UX runtime not exercised"
              echo
              echo "Host capability reason: ${CUSTOMER_UX_REASON}"
              echo
              echo "The suite is running in documented skip mode; this result is not runtime-release evidence."
            } >> "${GITHUB_STEP_SUMMARY}"
            bash scripts/customer-ux-check.sh
          fi
